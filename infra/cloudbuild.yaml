steps:
  - name: 'node:20'
    entrypoint: bash
    args:
      - -c
      - npm ci
  - name: 'node:20'
    entrypoint: bash
    args:
      - -c
      - npm run build && npm run build:web
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -f
      - Dockerfile.server
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/kibitz-server:${_IMAGE_TAG}
      - .
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/kibitz-server:${_IMAGE_TAG}
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -f
      - Dockerfile.web
      - --build-arg
      - VITE_API_BASE_URL=${_VITE_API_BASE_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/kibitz-web:${_IMAGE_TAG}
      - .
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/kibitz-web:${_IMAGE_TAG}
images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/kibitz-server:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/kibitz-web:${_IMAGE_TAG}
substitutions:
  _PROJECT_ID: ''
  _REGION: us-central1
  _REPOSITORY: kibitz
  _IMAGE_TAG: latest
  _VITE_API_BASE_URL: ''
